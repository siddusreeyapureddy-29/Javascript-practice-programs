<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>palindrome</title>
</head>
<body>
    <script>
    let str="siddu";
    let reversed=str.split("").reverse().join("");
    if(str==reversed){
        console.log(str + "is palindrome");
    }
    else{
        console.log(str + "is not a palindrome");
    }
    </script>
</body>
</html>
