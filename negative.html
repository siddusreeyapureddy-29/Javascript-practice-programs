<html>
    <head>
        <title>number is positive or negative</title>
    </head>
    <body>
        <script>
            let n=Number(prompt("Enter a number"));
            if(n>0){
                console.log("positive number");
            }
            else if(n<0){
                console.log("negitive number");
            }
            else{
                console.log("Zero");
            }

        </script>
    </body>
</html>
