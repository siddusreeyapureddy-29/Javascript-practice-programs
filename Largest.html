        let num=[90,56,34,23,12,21,97,45];

            return prev>curr?prev:curr;
        });
        console.log(output);

        let count=0;

            if(curr%2==0){
                count++;
            }
            return prev;
        },0);
        console.log(count);


        let salaries = [10000,20000,300000,400000,50000];

            return val;
        });
        console.log(salary);

            return prev+curr;
        })
